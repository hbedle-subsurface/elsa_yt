name: Collect comments

# Runs by itself every Monday, and whenever you press the button.
# To run it now: Actions tab -> Collect comments -> Run workflow.
#
# All 77 Oklahoma counties fit in a single run, so every county is
# checked every week. For daily, change the cron to '17 13 * * *';
# twice a week is '17 13 * * 1,4'.
#
# The weekly run is load-bearing. YouTube's developer policies require
# stored API data to be deleted or refreshed within 30 calendar days, and
# every run refreshes every comment on file. Skip a month and the comment
# text is dropped, leaving the links and your own coding.
#
# Needs one secret, YOUTUBE_API_KEY:
# Settings -> Secrets and variables -> Actions -> New repository secret.

on:
  schedule:
    - cron: '17 13 * * 1'
  workflow_dispatch:
    inputs:
      counties:
        description: 'Counties, comma separated. Blank uses the built-in Oklahoma list.'
        required: false
        default: ''
      days:
        description: 'How far back to look for videos. Blank uses 1095 (three years).'
        required: false
        default: ''
      topics:
        description: 'solar_siting, agrivoltaics, solar_on_water. Blank runs all.'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: collect-comments
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run the collector
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          python collect/collect.py \
            ${{ inputs.counties && format('--counties "{0}"', inputs.counties) || '' }} \
            ${{ inputs.days     && format('--days {0}',       inputs.days)     || '' }} \
            ${{ inputs.topics   && format('--topics "{0}"',   inputs.topics)   || '' }}

      - name: Save what it found
        run: |
          git config user.name  'comment collector'
          git config user.email 'actions@github.com'
          git add data/comments.json data/videos.json data/runs.json
          if git diff --staged --quiet; then
            echo "Nothing changed this time."
          else
            git commit -m "Collected comments, $(date -u +%Y-%m-%d)"
            git push
          fi
